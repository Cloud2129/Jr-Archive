[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jr-client-archive"
version = "0.1.0"
description = "JR Client Archive - archivio documentale desktop locale per studi professionali"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "JR Solution" }]

dependencies = [
    "PySide6>=6.8,<6.12",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "watchdog>=4.0,<5.0",
    "rapidfuzz>=3.9,<4.0",
    "qt-material>=2.14,<3.0",
    "PyMuPDF>=1.24,<1.25",
    "Pillow>=10.3,<11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pyinstaller>=6.7,<7.0",
]

[project.scripts]
jr-client-archive = "jr_client_archive.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
